
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drama | KDRAMER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .header-drama {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    .poster {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .meta { color: #b8b8c2; }
    .rating-xl { color: #ffcd3c; font-size: 1.1rem; font-weight: 700; }
    .chip {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: .25rem .6rem;
      font-size: .82rem;
      margin-right: .4rem;
      color: #e6e6ea;
    }
    @media (max-width: 768px) {
      .header-drama { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="pagina-principal">
  <header class="barra-navegacion">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="../index.html">
          <span class="titulo">KDRAMER REVIEWER</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto menu">
            <li class="nav-item"><a class="nav-link" href="../menus/foro.html">Foro</a></li>
            <li class="nav-item"><a class="nav-link" href="../menus/series.html">Series</a></li>
            <li class="nav-item destacable"><a class="nav-link btn btn-outline-primary ms-lg-2" href="../menus/cuenta.html">Cuenta</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container mt-5">
    <div id="contenido"></div>
  </main>

  <script>
    function renderStars(score) {
      const full = Math.floor(score);
      const half = score - full >= 0.5 ? 1 : 0;
      const empty = 5 - full - half;
      return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
    }

    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    if (!id) {
      document.getElementById('contenido').innerHTML = `<p>No se especificó ningún drama. Vuelve a la <a href="../menus/series.html">lista de series</a>.</p>`;
    } else {
      fetch('./dramas.json')
        .then(r => r.json())
        .then(dramas => {
          const d = dramas.find(x => x.id === id);
          if (!d) {
            document.getElementById('contenido').innerHTML = `<p>Drama no encontrado. Vuelve a la <a href="../menus/series.html">lista de series</a>.</p>`;
            return;
          }

          document.title = `${d.titulo} | KDRAMER`;

          document.getElementById('contenido').innerHTML = `
            <section class="header-drama mb-4">
              <div class="poster">
                <img src="${d.poster}" alt="${d.titulo}" style="width:100%; display:block;">
              </div>
              <div>
                <h1 class="mb-1">${d.titulo}</h1>
                <div class="meta mb-2">
                  ${d.anio ? d.anio : ''} ${d.plataformas ? ' · ' + d.plataformas.join(', ') : ''}
                </div>
                <div class="rating-xl mb-3">${renderStars(d.puntuacion)} ${d.puntuacion.toFixed(1)}/5</div>
                <div class="mb-3">
                  ${(d.generos || []).map(g => `<span class="chip">${g}</span>`).join('')}
                </div>
                <p>${d.sinopsis}</p>

                <div class="mt-3">
                  <a class="btn btn-outline-light btn-sm me-2" href="../menus/series.html">← Volver a Series</a>
                  <a class="btn btn-primary btn-sm" href="../menus/foro.html?topic=${encodeURIComponent(d.id)}">Abrir Foro del drama</a>
                </div>
              </div>
            </section>
          `;
        })
        .catch(err => {
          console.error(err);
          document.getElementById('contenido').innerHTML = `<p>Error cargando datos. Revisa <code>dramas/dramas.json</code>.</p>`;
        });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
