
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Series | KDRAMER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* Grid tipo catálogo */
    .grid-dramas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }
    .card-drama {
      background: #15151a;
      border-radius: 12px;
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .card-drama:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    }
    .card-drama img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: .75rem .9rem 1rem;
    }
    .card-title {
      font-size: 1rem;
      margin: 0 0 .25rem 0;
      color: #fff;
    }
    .card-meta {
      font-size: .85rem;
      color: #b8b8c2;
    }
    .badge-genero {
      background: rgba(255,255,255,.08);
      color: #e6e6ea;
      border: 1px solid rgba(255,255,255,.12);
      font-size: .72rem;
      margin-right: .35rem;
      padding: .15rem .45rem;
      border-radius: 999px;
    }
    .rating {
      color: #ffcd3c;
      font-weight: 600;
      font-size: .9rem;
    }
    .btn-ver {
      display: inline-block;
      margin-top: .5rem;
      font-size: .85rem;
      color: #08d9d6;
    }
    .btn-ver:hover { color: #66f3ec; }
  </style>
</head>
<body class="pagina-principal">
  <header class="barra-navegacion">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="../index.html">
          <span class="titulo">KDRAMER REVIEWER</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto menu">
            <li class="nav-item"><a class="nav-link" href="foro.html">Foro</a></li>
            <li class="nav-item"><a class="nav-link active" href="series.html">Series</a></li>
            <li class="nav-item destacable">
              <a class="nav-link btn btn-outline-primary ms-lg-2" href="cuenta.html">Cuenta</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container mt-5">
    <div class="d-flex align-items-end justify-content-between mb-3">
      <h1 class="mb-0">Series</h1>
      <!-- (Opcional) buscador/filtros más adelante -->
    </div>

    <div id="lista-dramas" class="grid-dramas"></div>
  </main>

  <script>
    // Helper para estrellas (⭐)
    function renderStars(score) {
      const full = Math.floor(score);
      const half = score - full >= 0.5 ? 1 : 0;
      const empty = 5 - full - half;
      return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
    }

    // Cargar JSON y poblar tarjetas
    fetch('../dramas/dramas.json')
      .then(r => r.json())
      .then(dramas => {
        const grid = document.getElementById('lista-dramas');
        dramas.forEach(d => {
          grid.insertAdjacentHTML('beforeend', `
            <article class="card-drama">
              <img src="../dramas/${d.poster}" alt="${d.titulo}" loading="lazy">
              <div class="card-body">
                <h3 class="card-title">${d.titulo}</h3>
                <div class="card-meta">
                  <span class="rating">${renderStars(d.puntuacion)} ${d.puntuacion.toFixed(1)}/5</span>
                  ${d.anio ? ` · ${d.anio}` : ''}
                </div>
                <div class="mt-2">
                  ${(d.generos || []).slice(0,3).map(g => `<span class="badge-genero">${g}</span>`).join('')}
                </div>
                <a class="btn-ver" href="../dramas/drama.html?id=${encodeURIComponent(d.id)}">Ver detalles →</a>
              </div>
            </article>
          `);
        });
      })
      .catch(err => {
        console.error('Error cargando dramas.json', err);
        const grid = document.getElementById('lista-dramas');
        grid.innerHTML = `<p>No se pudo cargar la lista de series. Revisa la ruta de <code>dramas/dramas.json</code>.</p>`;
      });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
